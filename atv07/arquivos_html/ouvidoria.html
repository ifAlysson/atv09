<form method="GET" id="formulario" onsubmit="return confirmarEnvio(event)" action="arquivos_html/sucesso.html">
    <fieldset>
        <div class="cabecalho-formulario">
            <legend><b>Ouvidoria &#10024;</b></legend>

            <img src="img/ouvidoria.jpg"
                 alt="Dahyun aguarda sua mensagem"
                 class="imagem-formulario">
        </div>

        <label for="nome">Nome Completo:</label><br>
        <input type="text" id="nome" name="nome" class="caixaformulario" required>
        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" class="caixaformulario" required>
        <br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" pattern="[0-9]{11}" inputmode="numeric" class="caixaformulario" required>
        <br><br>

        <label for="assunto">Assunto:</label><br>
        <select id="assunto" name="assunto" class="caixaformulario" required>
            <option value="">Selecione...</option>
            <option value="duvida">Dúvida</option>
            <option value="sugestao">Sugestão</option>
            <option value="critica">Crítica</option>
            <option value="reportarerro">Reportar Erro</option>
        </select>
        <br><br>

        <span>Perfil do Usuário:</span><br>

        <input type="radio" id="aluno" name="perfil" value="aluno" class="caixaformulario" required>
        <label for="aluno">Aluno</label><br>

        <input type="radio" id="professor" name="perfil" value="professor">
        <label for="professor">Professor</label><br>

        <input type="radio" id="comunidade" name="perfil" value="comunidade">
        <label for="comunidade">Comunidade Externa</label>
        <br><br>

        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagem" name="mensagem" rows="5" cols="40" minlength="15" class="caixaformulario" required></textarea>
        <br><br>

        <!--Este input oculto fará a página de sucesso receber o tema ativo-->
        <input type="hidden" id="tema" name="tema">

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </fieldset>
</form>
