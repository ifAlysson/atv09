<script>

    // Captura os parâmetros da URL
    const parametros = new URLSearchParams(window.location.search);
    // Obtém o nome e o e-mail
    const nome = parametros.get("nome");
    const email = parametros.get("email");
    // Adiciona o tema selecionado
    const tema = parametros.get("tema");
    document.getElementById("corpo").classList.add(tema);

    // Escreve a mensagem personalizada formatando uma string com os valores descobertos pelo URLSearchParams
    document.getElementById("mensagem").innerHTML =
        `Obrigado, <strong>${nome}</strong>!<br><br>
        Recebemos sua solicitação com sucesso (a Dahyun está muito feliz por<br>você ter nos contatado, olha o sorriso dela! &#x1F601;)<br>
        Em breve entraremos em contato através do e-mail
        <b>${email}</b>.`;
    
    // Faz com que o URL para voltar para a página principal contenha o tema atualmente ativo na URL. O index irá receber este tema e assim a mudança abrupta de tema decorrente pela troca de páginas será neutralizada
    document.getElementById("voltar").href = `../index.html?tema=${tema}`;
    console.log(document.getElementById("voltar").href);

</script>
